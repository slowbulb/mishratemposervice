<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#050512"/>
  <circle cx="10" cy="12" r="1" fill="#DDE6FF"/>
  <circle cx="54" cy="14" r="1.3" fill="#DDE6FF"/>
  <circle cx="50" cy="52" r="1" fill="#DDE6FF"/>
  <circle cx="12" cy="50" r="1.2" fill="#DDE6FF"/>

  <!-- roof sign -->
  <rect x="24" y="13" width="17" height="6" rx="2" fill="#0C1030" stroke="#F2C94C" stroke-width="1.5"/>
  <!-- canopy -->
  <path d="M18 24 C20 19, 44 19, 46 24 L46 27 L18 27 Z" fill="#7A2536" stroke="#14102A" stroke-width="1.5"/>
  <!-- body -->
  <path d="M13 44 C13 34, 15 27, 22 26 L44 26 C48 26, 50 30, 50 34 L50 42 C50 44, 49 45, 47 45 L15 45 C14 45, 13 44, 13 44 Z"
        fill="#B5384A" stroke="#14102A" stroke-width="1.5"/>
  <!-- window -->
  <rect x="16" y="30" width="13" height="12" rx="3" fill="#0C1030"/>
  <!-- windshield -->
  <rect x="31" y="30" width="16" height="12" rx="2" fill="#14102A" stroke="#F2C94C" stroke-width="1.2"/>
  <circle cx="39" cy="35" r="3" fill="#E8ECFF"/>
  <!-- wheels -->
  <circle cx="19" cy="47" r="6" fill="#14102A" stroke="#F2C94C" stroke-width="2"/>
  <circle cx="45" cy="48" r="7" fill="#14102A" stroke="#F2C94C" stroke-width="2"/>
  <!-- headlight star -->
  <path d="M53 36 l1.6 4 l4 1.6 l-4 1.6 l-1.6 4 l-1.6 -4 l-4 -1.6 l4 -1.6 z" fill="#F2C94C"/>
</svg>
